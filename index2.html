<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pocket AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d0d10; color:#e8e6e0; font-family:'Segoe UI',system-ui,sans-serif;
         height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 18px; border-bottom:1px solid #26262e; display:flex; align-items:center; gap:10px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#f59e0b; }
  .dot.ready { background:#4ade80; box-shadow:0 0 8px #4ade80; }
  header h1 { font-size:15px; font-weight:600; }
  #status { font-size:11px; color:#6b6b78; margin-left:auto; text-align:right; max-width:55%; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; font-size:14px;
         line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:#3b3bce; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:#1b1b22; border:1px solid #2a2a33; border-bottom-left-radius:4px; }
  #progress { height:3px; background:#26262e; }
  #pbar { height:100%; width:0%; background:linear-gradient(90deg,#3b3bce,#4ade80); transition:width .3s; }
  #bar { display:flex; gap:8px; padding:12px; border-top:1px solid #26262e; }
  #inp { flex:1; background:#1b1b22; border:1px solid #2a2a33; color:#e8e6e0;
         border-radius:22px; padding:11px 16px; font-size:14px; outline:none; }
  #inp:focus { border-color:#3b3bce; }
  #send { background:#3b3bce; border:none; color:#fff; border-radius:22px;
          padding:0 20px; font-size:14px; font-weight:600; cursor:pointer; }
  #send:disabled { opacity:.4; }
</style>
</head>
<body>
<header><div class="dot" id="dot"></div><h1>Pocket AI</h1><div id="status">loading engine...</div></header>
<div id="progress"><div id="pbar"></div></div>
<div id="chat">
  <div class="msg bot">First open needs internet to download the model (~350MB, one time). After that I live in your browser cache and work offline. Give me a minute...</div>
</div>
<div id="bar">
  <input id="inp" placeholder="Downloading brain..." autocomplete="off" disabled>
  <button id="send" disabled>Send</button>
</div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
const chat = document.getElementById('chat'), inp = document.getElementById('inp'),
      send = document.getElementById('send'), status = document.getElementById('status'),
      pbar = document.getElementById('pbar'), dot = document.getElementById('dot');

const history = [{ role: "system",
  content: "You are Pocket AI, a helpful assistant running fully on the user's phone. Be concise and direct. You can answer in English or Greek." }];

function addMsg(cls, text){
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

let engine;
try {
  if (!navigator.gpu) throw new Error("WebGPU not available");
  engine = await webllm.CreateMLCEngine(MODEL, {
    initProgressCallback: p => {
      status.textContent = p.text.slice(0, 60);
      pbar.style.width = (p.progress * 100).toFixed(0) + '%';
    }
  });
  status.textContent = MODEL.split('-q4')[0] + ' · on-device';
  dot.classList.add('ready');
  pbar.style.width = '100%';
  addMsg('bot', "Ready. I'm a real 500M-parameter model running on your phone's GPU. Ask me anything.");
  inp.disabled = false; send.disabled = false;
  inp.placeholder = "Say something...";
  inp.focus();
} catch (e) {
  status.textContent = 'failed';
  addMsg('bot', "Couldn't start: " + e.message +
    "\n\nFixes:\n1. Open this file from a local server or host it (e.g. Vercel) — content:// URLs from the Files app can block WebGPU.\n2. Make sure Chrome is updated (WebGPU needs Chrome 121+).\n3. Try chrome://flags → enable 'WebGPU'.");
}

async function reply(userText){
  send.disabled = true; inp.disabled = true;
  history.push({ role: "user", content: userText });
  const el = addMsg('bot', '...');
  let out = '';
  const stream = await engine.chat.completions.create({
    messages: history, stream: true, temperature: 0.7, max_tokens: 512
  });
  for await (const chunk of stream) {
    out += chunk.choices[0]?.delta?.content || '';
    el.textContent = out; chat.scrollTop = chat.scrollHeight;
  }
  history.push({ role: "assistant", content: out });
  if (history.length > 21) history.splice(1, 2); // keep memory bounded
  send.disabled = false; inp.disabled = false; inp.focus();
}

function go(){
  const t = inp.value.trim();
  if (!t || send.disabled) return;
  inp.value = ''; addMsg('user', t); reply(t);
}
send.onclick = go;
inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
</script>
</body>
</html>
